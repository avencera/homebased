# Publish macOS and Linux binaries when a version tag is pushed.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Asset names match rustywind / install.sh:
#   homebased-<tag>-<target>.tar.gz
#
# Linux uses musl so the one-liner works on GNU and musl hosts.

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the binary embeds web/build/, so the dashboard must exist before cargo runs
      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: homebased
          package: homebased
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          checksum: sha256
          locked: true

  upload-install-script:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" install.sh --clobber
