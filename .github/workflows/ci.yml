name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: just ci (${{ matrix.os }})
    strategy:
      # each platform has its own process cleanup code, so one failing must not
      # hide the other's result
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v3
      # `just ci` checks the dashboard before building it, so dependencies come first
      - name: Install dashboard dependencies
        run: just web-install
      - name: just ci
        run: just ci
