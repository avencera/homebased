[workspace]
members = ["xtask"]

[package]
name = "homebased"
version = "0.1.0"
edition = "2024"
description = "Supervise long-running agent and general task workloads and report them to a Codex thread"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
humantime-serde = "1.1.1"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
mime_guess = "2"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "user"] }
ractor = "0.16.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }
which = "8.0.6"

[dev-dependencies]
assert_cmd = "2.2.2"
jsonschema = { version = "0.56.0", default-features = false }
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
